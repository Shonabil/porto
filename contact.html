<!DOCTYPE html>

<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --surface2: #f0f0f0;
      --text: #111111;
      --text-muted: #666666;
      --active: #c8a27a;
      --active-glow: rgba(200,162,122,0.2);
      --active-dim: rgba(200,162,122,0.07);
      --border: rgba(0,0,0,0.08);
      --border-focus: rgba(200,162,122,0.5);
    }
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }
    body {
      background: var(--bg); color: var(--text);
      overflow-x: hidden; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60vw 50vh at 15% 55%, rgba(200,162,122,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 50vw 40vh at 90% 20%, rgba(200,162,122,0.04) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(200,162,122,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,162,122,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none; z-index: 0;
    }

    /* NAV */
    .top-nav {
      position: fixed; top: 5vh; right: 5vw;
      display: flex; gap: 2rem; align-items: center;
      opacity: 0; animation: fadeDown 0.8s ease 0.4s forwards; z-index: 100;
    }
    .back-btn {
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--bg); background: var(--active);
      text-decoration: none; padding: 0.55rem 1.4rem;
      border-radius: 3px; border: 1.5px solid var(--active);
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background: transparent; color: var(--active);
      transform: translateY(-2px); box-shadow: 0 8px 20px var(--active-glow);
    }
    .nav-link {
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none;
      position: relative; transition: color 0.3s ease;
    }
    .nav-link::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 0; height: 1px; background: var(--active);
      transition: width 0.35s ease;
    }
    .nav-link:hover { color: var(--active); }
    .nav-link:hover::after { width: 100%; }

    @keyframes fadeDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(40px)}  to{opacity:1;transform:translateY(0)} }

    /* MAIN */
    .container {
      position: relative; max-width: 1200px;
      margin: 0 auto; padding: 16vh 8vw 10vh; z-index: 1;
    }

    .page-label {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1rem;
      opacity: 0; animation: fadeUp 0.8s ease 0.5s forwards;
    }
    .page-label-line { width: 24px; height: 1px; background: var(--active); }
    .page-label-text {
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--active);
    }

    .page-title {
      font-size: clamp(3.5rem, 9vw, 7rem);
      font-weight: 900; color: var(--text);
      line-height: 0.95; letter-spacing: -0.02em;
      opacity: 0; animation: fadeUp 0.8s ease 0.65s forwards;
      margin-bottom: 4rem;
    }

    /* CONTENT WRAPPER */
    .content-wrapper {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 5rem;
    }

    /* LEFT — CONTACT INFO */
    .contact-info {
      opacity: 0; animation: fadeUp 0.8s ease 0.9s forwards;
    }

    .section-heading {
      font-size: 1.1rem; font-weight: 800; color: var(--text);
      margin-bottom: 1.8rem;
      display: flex; align-items: center; gap: 0.8rem;
    }
    .section-heading::before {
      content: ''; width: 4px; height: 1.2em;
      background: var(--active); border-radius: 2px;
    }

    /* Info items */
    .info-items { display: flex; flex-direction: column; gap: 0; }

    .info-item {
      display: flex; align-items: flex-start; gap: 1.2rem;
      padding: 1.4rem 0;
      border-bottom: 1px solid var(--border);
      transition: all 0.3s ease;
      position: relative;
    }
    .info-item::before {
      content: ''; position: absolute;
      left: -8px; top: 0; bottom: 0; width: 2px;
      background: var(--active); border-radius: 1px;
      transform: scaleY(0); transition: transform 0.3s ease;
      transform-origin: center;
    }
    .info-item:hover::before { transform: scaleY(1); }
    .info-item:hover { padding-left: 8px; }

    .info-icon {
      width: 38px; height: 38px; border-radius: 8px;
      background: var(--active-dim); border: 1px solid rgba(200,162,122,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; color: var(--active); flex-shrink: 0;
    }
    .info-body { flex: 1; }
    .info-label {
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--active); margin-bottom: 0.3rem;
    }
    .info-value {
      font-size: 0.95rem; font-weight: 500; color: var(--text);
    }
    .info-value a {
      color: var(--text); text-decoration: none;
      border-bottom: 1px solid #333; transition: border-color 0.3s ease;
    }
    .info-value a:hover { border-color: var(--text); }

    /* SOCIAL LINKS */
    .social-section { margin-top: 2.5rem; }
    .social-link i { font-size: 0.85rem; }
    .icon { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; fill: currentColor; }
    .social-label {
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 1rem;
    }
    .social-links { display: flex; gap: 0.8rem; }
    .social-link {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-muted);
      text-decoration: none; font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .social-link:hover {
      border-color: rgba(200,162,122,0.3); color: var(--active);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* RIGHT — FORM */
    .contact-form {
      opacity: 0; animation: fadeUp 0.8s ease 1.1s forwards;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
    }

    .input-group { margin-bottom: 1.4rem; }

    label {
      display: block; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.6rem;
    }

    input, textarea {
      width: 100%; padding: 0.9rem 1rem;
      font-size: 0.95rem; font-family: 'Inter', sans-serif;
      color: var(--text);
      background: #ffffff;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      transition: all 0.3s ease;
      outline: none;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(119,119,119,0.5);
    }
    input:focus, textarea:focus {
      border-color: var(--border-focus);
      background: rgba(200,162,122,0.04);
      box-shadow: 0 0 0 4px rgba(200,162,122,0.06);
    }
    textarea { resize: vertical; min-height: 140px; }

    .submit-btn {
      width: 100%; padding: 1.1rem;
      font-size: 0.85rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--bg); background: var(--active);
      border: 1.5px solid var(--active);
      border-radius: 8px; cursor: pointer;
      transition: all 0.35s cubic-bezier(0.19,1,0.22,1);
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    }
    .submit-btn:hover {
      background: transparent; color: var(--active);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px var(--active-glow);
    }
    .submit-btn:active { transform: translateY(0); }

    /* TOAST */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface); border: 1px solid rgba(200,162,122,0.3);
      color: var(--text); padding: 1rem 2rem;
      border-radius: 8px; font-size: 0.88rem; font-weight: 500;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
      transition: transform 0.5s cubic-bezier(0.19,1,0.22,1), opacity 0.4s ease;
      opacity: 0; z-index: 999;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* DECO */
    .number-deco {
      position: fixed; bottom: 5vh; right: 5vw;
      font-size: clamp(7rem, 14vw, 11rem); font-weight: 900;
      color: transparent; -webkit-text-stroke: 1px rgba(200,162,122,0.06);
      line-height: 1; pointer-events: none; z-index: 0; user-select: none;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .container { padding: 14vh 5vw 8vh; }
      .content-wrapper { grid-template-columns: 1fr; gap: 3rem; }
      .number-deco { display: none; }
      .top-nav { top: 3vh; right: 5vw; gap: 1rem; }
      .back-btn { font-size: 0.65rem; padding: 0.45rem 1rem; }
      .form-card { padding: 1.5rem; }
    }
  </style>
  <script src="lang.js" defer></script>

  <script>
    function tr(key, fallback) {
      return (window.Lang && window.Lang.t(key)) || fallback;
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.style.borderColor = isError ? 'rgba(248,113,113,0.3)' : 'rgba(200,162,122,0.3)';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function handleSubmit() {
      const name    = document.getElementById('name').value.trim();
      const email   = document.getElementById('email').value.trim();
      const subject = document.getElementById('subject').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!name || !email || !message) {
        showToast(tr('cnt.toast.fill', 'Please fill in all required fields.'), true);
        return;
      }

      const text = `${subject || tr('cnt.subjectDefault', 'Portfolio Contact')}\n\nFrom: ${name}\nEmail: ${email}\n\n${message}`;
      window.open(`https://wa.me/6281241081143?text=${encodeURIComponent(text)}`, '_blank', 'noopener,noreferrer');

      document.getElementById('name').value    = '';
      document.getElementById('email').value   = '';
      document.getElementById('subject').value = '';
      document.getElementById('message').value = '';

      showToast(tr('cnt.toast.ok', 'Thank you! Opening WhatsApp...'));
    }
  </script>
