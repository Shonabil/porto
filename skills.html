<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Skills — Nabil</title>
  <meta name="description" content="Technologies and skills of Muhammad Syafwan Nabil — HTML, CSS, JavaScript, PHP, Laravel, MySQL, Flutter, and more." />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --surface2: #f0f0f0;
      --text: #111111;
      --text-muted: #666666;
      --active: #c8a27a;
      --active-glow: rgba(200,162,122,0.2);
      --active-dim: rgba(200,162,122,0.08);
      --border: rgba(0,0,0,0.08);
    }
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }
    body {
      background: var(--bg); color: var(--text);
      overflow-x: hidden; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60vw 50vh at 15% 60%, rgba(200,162,122,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 50vw 40vh at 90% 20%, rgba(200,162,122,0.04) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(200,162,122,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,162,122,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none; z-index: 0;
    }

    /* NAV */
    .top-nav {
      position: fixed; top: 5vh; right: 5vw;
      display: flex; gap: 2rem; align-items: center;
      opacity: 0; animation: fadeDown 0.8s ease 0.4s forwards; z-index: 100;
    }
    .back-btn {
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--bg); background: var(--active);
      text-decoration: none; padding: 0.55rem 1.4rem;
      border-radius: 3px; border: 1.5px solid var(--active);
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background: transparent; color: var(--active);
      transform: translateY(-2px); box-shadow: 0 8px 20px var(--active-glow);
    }
    .nav-link {
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text-muted); text-decoration: none;
      position: relative; transition: color 0.3s ease;
    }
    .nav-link::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 0; height: 1px; background: var(--active);
      transition: width 0.35s ease;
    }
    .nav-link:hover { color: var(--active); }
    .nav-link:hover::after { width: 100%; }

    @keyframes fadeDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(40px)}  to{opacity:1;transform:translateY(0)} }

    /* MAIN */
    .container {
      position: relative; max-width: 1200px;
      margin: 0 auto; padding: 16vh 8vw 10vh; z-index: 1;
    }

    .page-label {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1rem;
      opacity: 0; animation: fadeUp 0.8s ease 0.5s forwards;
    }
    .page-label-line { width: 24px; height: 1px; background: var(--active); }
    .page-label-text {
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--active);
    }

    .page-title {
      font-size: clamp(3.5rem, 9vw, 7rem);
      font-weight: 900; color: var(--text);
      line-height: 0.95; letter-spacing: -0.02em;
      opacity: 0; animation: fadeUp 0.8s ease 0.65s forwards;
      margin-bottom: 4rem;
    }

    /* SKILL CATEGORIES */
    .categories-wrapper {
      display: flex; flex-direction: column; gap: 3.5rem;
    }

    .skill-category {
      opacity: 0; animation: fadeUp 0.8s ease forwards;
    }
    .skill-category:nth-child(1) { animation-delay: 0.9s; }
    .skill-category:nth-child(2) { animation-delay: 1.1s; }
    .skill-category:nth-child(3) { animation-delay: 1.3s; }

    .category-header {
      display: flex; align-items: center; gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .category-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--active-dim); border: 1px solid rgba(200,162,122,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: var(--active);
    }
    .skill-emoji { font-size: 1rem; color: var(--active); }
    .icon { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; fill: currentColor; }
    .category-name {
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--active);
    }
    .category-line {
      flex: 1; height: 1px; background: var(--border);
    }

    /* SKILL CARDS */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .skill-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.4rem 1.5rem;
      transition: all 0.35s cubic-bezier(0.19,1,0.22,1);
      position: relative;
      overflow: hidden;
    }
    .skill-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--active-dim) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .skill-card:hover {
      border-color: rgba(200,162,122,0.3);
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(0,0,0,0.3), 0 0 0 1px rgba(200,162,122,0.1);
    }
    .skill-card:hover::before { opacity: 1; }

    .skill-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; position: relative;
    }
    .skill-logo-wrap {
      display: grid; place-items: center;
      width: 46px; height: 46px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid rgba(200,162,122,0.18);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.35s cubic-bezier(0.19,1,0.22,1);
    }
    .skill-card:hover .skill-logo-wrap {
      transform: translateY(-2px);
      border-color: rgba(200,162,122,0.4);
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }
    .skill-logo {
      width: 24px; height: 24px;
      object-fit: contain;
      display: block;
    }
    .skill-logo-lg {
      width: 32px; height: 32px;
    }
    .skill-badge {
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--active);
      background: var(--active-dim);
      border: 1px solid rgba(200,162,122,0.15);
      padding: 3px 10px; border-radius: 20px;
    }

    .skill-bar-track {
      width: 100%; height: 3px;
      background: rgba(0,0,0,0.08);
      border-radius: 2px; overflow: hidden;
    }
    .skill-bar-fill {
      height: 100%; width: 0;
      background: linear-gradient(90deg, var(--active), #e8c9a0);
      border-radius: 2px;
      transition: width 1.6s cubic-bezier(0.19,1,0.22,1);
    }

    /* DECO */
    .number-deco {
      position: fixed; bottom: 5vh; right: 5vw;
      font-size: clamp(7rem, 14vw, 11rem); font-weight: 900;
      color: transparent; -webkit-text-stroke: 1px rgba(200,162,122,0.06);
      line-height: 1; pointer-events: none; z-index: 0; user-select: none;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .container { padding: 14vh 5vw 8vh; }
      .skills-grid { grid-template-columns: 1fr; }
      .number-deco { display: none; }
      .top-nav { top: 3vh; right: 5vw; gap: 1rem; }
      .back-btn { font-size: 0.65rem; padding: 0.45rem 1rem; }
    }
  </style>
  <script src="lang.js" defer></script>
</head>

  <div class="number-deco">04</div>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const fills = entry.target.querySelectorAll('.skill-bar-fill');
        fills.forEach(fill => {
          setTimeout(() => {
            fill.style.width = fill.dataset.progress + '%';
          }, 100);
        });
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.2 });

    document.querySelectorAll('.skill-category').forEach(cat => observer.observe(cat));
  </script>
